<!-- page: key=plan -->
<section class="page-head">
  <p class="kicker" data-i18n="pl.kicker">…</p>
  <h1 class="page-title" data-i18n="pl.title" data-split>…</h1>
  <p class="page-lead section-body" data-i18n="pl.p1">…</p>
</section>
<section class="plan">
  <dl class="plan-list">
    <div><dt data-i18n="pl.d1">…</dt><dd data-i18n="pl.v1">…</dd></div>
    <div><dt data-i18n="pl.d2">…</dt><dd data-i18n="pl.v2">…</dd></div>
    <div><dt data-i18n="pl.d3">…</dt><dd data-i18n="pl.v3">…</dd></div>
    <div><dt data-i18n="pl.d4">…</dt><dd data-i18n="pl.v4">…</dd></div>
  </dl>
  <figure class="plan-media reveal-clip"><img src="assets/img/ch-rooftop-800.jpg" srcset="assets/img/ch-rooftop-800.jpg 800w, assets/img/ch-rooftop.jpg 1600w" sizes="(max-width: 1024px) 100vw, 44vw" alt="" data-i18n-alt="pl.alt" loading="lazy"></figure>
</section>
<section class="availability" id="disponibilites" data-i18n-aria="a11y.availability" aria-label="Disponibilités">
  <div class="avail-inner">
    <p class="kicker" data-i18n="bk.kicker">…</p>
    <h2 class="section-title" data-i18n="bk.title" data-split>…</h2>
    <p class="section-body" data-i18n="bk.body">…</p>
    <form class="enquiry" id="enquiry" novalidate>
      <div class="f-row">
        <label><span data-i18n="fm.in">…</span><input type="date" name="arrivee" required></label>
        <label><span data-i18n="fm.out">…</span><input type="date" name="depart" required></label>
        <label><span data-i18n="fm.guests">…</span><select name="personnes"><option>1</option><option selected>2</option></select></label>
      </div>
      <label><span data-i18n="fm.name">…</span><input type="text" name="nom" autocomplete="name" required></label>
      <label><span data-i18n="fm.msg">…</span><textarea name="message" rows="3" data-i18n-ph="fm.msgph" placeholder=""></textarea></label>
      <p class="f-error" id="f-error" role="alert" hidden data-i18n="fm.err">…</p>
      <div class="f-actions">
        <button type="submit" class="btn btn-solid" data-i18n="fm.submit">…</button>
        <span class="f-hint" data-i18n="fm.hint">…</span>
      </div>
      <p class="f-done" hidden><span data-i18n="fm.done">…</span> <a class="f-done-link" href="#" data-i18n="fm.again">…</a></p>
    </form>
    <p class="book-alt"><a href="mailto:info@elementa-experiences.com">info@elementa-experiences.com</a></p>
  </div>
</section>
