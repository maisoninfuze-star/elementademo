<!--page {"id":"mind","title":"meta.mind.title","desc":"meta.mind.desc","logo":"emblem,wordmark","navclass":" is-scrolled","head":""}-->
{{> head}}
{{> header}}
<main id="top">
  <div id="contenu" tabindex="-1"></div>
  <section class="section page-head" data-theme="forest">
    <div class="wrap">
      <p class="eyebrow reveal" data-i18n="mindp.eyebrow"></p>
      <h1 class="display reveal" data-i18n="mindp.title"></h1>
      <p class="lead reveal" data-delay="1" data-i18n="mindp.lead"></p>
    </div>
  </section>
  <section class="section section-tight" data-theme="forest">
    <div class="wrap">
      <figure class="figure ratio-16-9 reveal-img"><img src="assets/img/deck-view.jpg" srcset="assets/img/deck-view-800.jpg 800w, assets/img/deck-view.jpg 1600w" sizes="(min-width: 1440px) 1312px, 92vw" width="1600" height="1066" decoding="async" data-i18n-attr="alt:mindp.alt1"></figure>
    </div>
  </section>
  <section class="section" data-theme="light">
    <div class="wrap">
      <div class="pillars" style="margin-top:0">
        <div class="pillar reveal"><h3 data-i18n="mindp.p1.t"></h3><p data-i18n="mindp.p1.p"></p></div>
        <div class="pillar reveal" data-delay="1"><h3 data-i18n="mindp.p2.t"></h3><p data-i18n="mindp.p2.p"></p></div>
        <div class="pillar reveal" data-delay="2"><h3 data-i18n="mindp.p3.t"></h3><p data-i18n="mindp.p3.p"></p></div>
      </div>
    </div>
  </section>
  <section class="section" data-theme="dark">
    <div class="wrap">
      <div class="story">
        <figure class="figure ratio-3-2 story-media reveal-img"><img src="assets/img/lounger.jpg" srcset="assets/img/lounger-800.jpg 800w, assets/img/lounger.jpg 1474w" sizes="(min-width: 900px) 56vw, 92vw" width="1474" height="982" loading="lazy" decoding="async" data-i18n-attr="alt:mindp.alt2"></figure>
        <div class="story-copy">
          <p class="lead reveal" data-i18n="mindp.b1"></p>
          <p class="body reveal" data-delay="1" data-i18n="mindp.b2"></p>
          <div class="actions reveal" data-delay="2">
            <a class="btn" href="cabines.html"><span data-i18n="cab.more"></span></a>
            <a class="link" href="./#planifier"><span data-i18n="nav.plan"></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10M7 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
{{> footer}}
