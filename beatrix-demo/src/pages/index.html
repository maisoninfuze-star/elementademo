            <div><dt data-i18n="loc.d1"></dt><dd data-i18n="loc.v1"></dd></div>
            <div><dt data-i18n="loc.d2"></dt><dd data-i18n="loc.v2"></dd></div>

        <div class="plan-form" id="planifier" tabindex="-1">
          <p class="eyebrow reveal" data-i18n="plan.eyebrow"></p>

          <p class="lead reveal" data-delay="1" style="margin-top:22px" data-i18n="plan.lead"></p>
          <form class="form reveal" data-delay="1" id="enquiry" novalidate data-endpoint="" method="post" action="#planifier">
            <div class="form-row">
              <div class="field"><label for="f-arrival" data-i18n="f.arrival"></label><input id="f-arrival" name="arrival" type="date" required autocomplete="off"><span class="err" id="e-arrival" aria-live="polite"></span></div>
              <div class="field"><label for="f-departure" data-i18n="f.departure"></label><input id="f-departure" name="departure" type="date" required autocomplete="off"><span class="err" id="e-departure" aria-live="polite"></span></div>
              <div class="field wide"><label for="f-guests" data-i18n="f.guests"></label><select id="f-guests" name="guests" required><option value="" data-i18n="f.gChoose"></option><option value="1" data-i18n="f.g1"></option><option value="2" data-i18n="f.g2"></option><option value="3+" data-i18n="f.g3"></option></select><span class="err" id="e-guests" aria-live="polite"></span></div>
              <div class="field"><label for="f-name" data-i18n="f.name"></label><input id="f-name" name="name" type="text" required autocomplete="name"><span class="err" id="e-name" aria-live="polite"></span></div>
              <div class="field"><label for="f-email" data-i18n="f.email"></label><input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email"><span class="err" id="e-email" aria-live="polite"></span></div>
              <div class="field wide"><label for="f-note"><span data-i18n="f.note"></span> <span class="opt" data-i18n="f.optional"></span></label><textarea id="f-note" name="note" rows="4" data-i18n-attr="placeholder:f.notePh"></textarea></div>
            </div>
            <label class="check"><input type="checkbox" name="consent" value="yes"><span data-i18n="f.consent"></span></label>
            <div class="form-foot">
              <button type="submit" class="btn btn-solid"><span data-i18n="f.submit"></span></button>
              <p class="form-note" data-i18n="f.privacy"></p>
            </div>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
