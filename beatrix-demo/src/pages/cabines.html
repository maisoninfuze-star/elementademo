{{> head}}
{{> header}}
<main id="top">
  <div id="contenu" tabindex="-1"></div>
  <section class="section page-head" data-theme="dark">
    <div class="wrap">
      <p class="eyebrow reveal" data-i18n="cabins.eyebrow"></p>
      <h1 class="display reveal" data-i18n="cabins.title"></h1>
      <p class="lead reveal" data-delay="1" data-i18n="cabins.lead"></p>
      <div class="actions reveal" data-delay="2">
        <button type="button" class="btn" data-tour-open><span data-i18n="hero.visit"></span></button>
        <a class="link" href="#equipements"><span data-i18n="cab.equip"></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M2 7l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
      </div>
    </div>
  </section>
  <section class="section section-tight" data-theme="dark">
    <div class="wrap">
      <figure class="figure ratio-16-9 reveal-img">
        <img src="assets/img/window.jpg" srcset="assets/img/window-800.jpg 800w, assets/img/window.jpg 1600w" sizes="(min-width: 1440px) 1312px, 92vw" width="1600" height="1066" decoding="async" data-i18n-attr="alt:cabins.s1.alt">
      </figure>
    </div>
  </section>

        </div>
