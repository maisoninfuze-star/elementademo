<!--page {"id":"story","title":"meta.story.title","desc":"meta.story.desc","logo":"emblem,wordmark","navclass":" is-scrolled","head":""}-->
{{> head}}
{{> header}}
<main id="top">
  <div id="contenu" tabindex="-1"></div>
  <section class="section page-head" data-theme="light">
    <div class="wrap">
      <p class="eyebrow reveal" data-i18n="storyp.eyebrow"></p>
      <h1 class="display reveal" data-i18n="storyp.title"></h1>
      <p class="lead reveal" data-delay="1" data-i18n="storyp.lead"></p>
    </div>
  </section>
  <section class="section section-tight" data-theme="light">
    <div class="wrap">
      <article class="story">
        <figure class="figure ratio-3-2 story-media reveal-img"><img src="assets/film/still-aerial-1920.jpg" srcset="assets/film/still-aerial-960.jpg 960w, assets/film/still-aerial-1920.jpg 1920w" sizes="(min-width: 900px) 56vw, 92vw" width="1920" height="1080" decoding="async" data-i18n-attr="alt:storyp.b1.alt"></figure>
        <div class="story-copy">
          <h2 class="title-sm reveal" data-i18n="storyp.b1.t"></h2>
          <p class="body reveal" data-delay="1" data-i18n="storyp.b1.p1"></p>
          <p class="body reveal" data-delay="1" data-i18n="storyp.b1.p2"></p>
        </div>
      </article>
      <article class="story alt">
        <figure class="figure ratio-3-2 story-media reveal-img"><img src="assets/img/kitchen-materials.jpg" srcset="assets/img/kitchen-materials-800.jpg 800w, assets/img/kitchen-materials.jpg 1474w" sizes="(min-width: 900px) 56vw, 92vw" width="1474" height="982" loading="lazy" decoding="async" data-i18n-attr="alt:storyp.b2.alt"></figure>
        <div class="story-copy">
          <h2 class="title-sm reveal" data-i18n="storyp.b2.t"></h2>
          <p class="body reveal" data-delay="1" data-i18n="storyp.b2.p1"></p>
          <p class="body reveal" data-delay="1" data-i18n="storyp.b2.p2"></p>
        </div>
      </article>
      <article class="story">
        <figure class="figure ratio-3-2 story-media reveal-img"><img src="assets/img/deck-table.jpg" srcset="assets/img/deck-table-800.jpg 800w, assets/img/deck-table.jpg 1600w" sizes="(min-width: 900px) 56vw, 92vw" width="1600" height="1066" loading="lazy" decoding="async" data-i18n-attr="alt:storyp.b3.alt"></figure>
        <div class="story-copy">
          <h2 class="title-sm reveal" data-i18n="storyp.b3.t"></h2>
          <p class="body reveal" data-delay="1" data-i18n="storyp.b3.p"></p>
        </div>
      </article>
    </div>
  </section>
  <section class="section" data-theme="dark">
    <div class="wrap">
      <h2 class="title reveal" style="margin-bottom:clamp(36px,5vw,64px)" data-i18n="storyp.people.t"></h2>
      <div class="people">
        <div class="pillar reveal"><h3 data-i18n="storyp.h.name"></h3><span class="role" data-i18n="storyp.h.role"></span><p data-i18n="storyp.h.p"></p></div>
        <div class="pillar reveal" data-delay="1"><h3 data-i18n="storyp.a.name"></h3><span class="role" data-i18n="storyp.a.role"></span><p data-i18n="storyp.a.p"></p></div>
      </div>
    </div>
  </section>
  <section class="section" id="projet" data-theme="light" tabindex="-1">
    <div class="wrap">
      <p class="eyebrow reveal" data-i18n="storyp.proj.eyebrow"></p>
      <h2 class="title reveal" data-i18n="storyp.proj.t"></h2>
      <div class="pillars">
        <div class="pillar reveal"><span class="status-tag" data-i18n="storyp.proj.now.tag"></span><p data-i18n="storyp.proj.now.p"></p></div>
        <div class="pillar reveal" data-delay="1"><span class="status-tag" data-i18n="storyp.proj.p1.tag"></span><p data-i18n="storyp.proj.p1.p"></p></div>
        <div class="pillar reveal" data-delay="2"><span class="status-tag" data-i18n="storyp.proj.vis.tag"></span><p data-i18n="storyp.proj.vis.p"></p></div>
      </div>
      <hr class="rule" style="margin:clamp(40px,6vw,80px) 0 clamp(28px,4vw,48px)">
      <h2 class="title-sm reveal" data-i18n="storyp.occ.t"></h2>
      <p class="body reveal" data-delay="1" style="margin-top:16px" data-i18n="storyp.occ.p"></p>
      <div class="actions reveal" data-delay="2"><a class="btn btn-solid" href="./#planifier"><span data-i18n="storyp.occ.cta"></span></a></div>
    </div>
  </section>
</main>
{{> footer}}
