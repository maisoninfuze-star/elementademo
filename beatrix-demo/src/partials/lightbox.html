<dialog class="lightbox" id="lightbox" data-i18n-attr="aria-label:gal.dialogAria">
  <div class="lightbox-inner">
    <button type="button" class="icon-btn lightbox-close" data-lb-close data-i18n-attr="aria-label:gal.close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <div class="lightbox-stage"><img class="lightbox-img" alt="" width="1600" height="1066"></div>
    <div class="lightbox-bar">
      <p><span class="lightbox-caption" aria-live="polite"></span><span class="count" aria-hidden="true"></span></p>
      <div class="lightbox-nav">
        <button type="button" class="icon-btn" data-lb-prev data-i18n-attr="aria-label:gal.prev"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2L4 8l6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button type="button" class="icon-btn" data-lb-next data-i18n-attr="aria-label:gal.next"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>
  </div>
</dialog>
